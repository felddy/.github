---
name: sync-labels

# Trigger-only stub: the dual-trigger sync-labels workflow in
# felddy/reusable-workflows does the work. The labels assigned by this
# repository's default issue forms must exist here as well as in every
# destination repository; the central definitions provide both.

on:
  schedule:
    - cron: 17 5 * * 1  # weekly, Monday morning
  workflow_dispatch:

permissions: {}

jobs:
  labeler:
    uses: felddy/reusable-workflows/.github/workflows/sync-labels.yml@v5
    permissions:
      contents: read
      issues: write
